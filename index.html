<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Home Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;

      padding: 50px;
    }
    img {
      width: 200px;
      border-radius: 50%;

      padding: 10px 20px;

    .links a.github {
      background-color: #333;
    }

</head>
<body>
  <h1>Welcome to My Home Page</h1>
  <img src="/portfolio image.jpg" alt="Profile Picture">
  <div class="links">
    <a class="github" href="https://github.com/openai" target="_blank">GitHub</a>
    <a href="https://www.linkedin.com/company/openai" target="_blank">LinkedIn</a>
  </div>
</body>
</html>
